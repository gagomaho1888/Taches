{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>{{ titre_page }}</h2>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
            {% endfor %}

            <div class="form-actions">
                <a href="{% url 'groupe_list' %}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">{{ bouton_texte }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
