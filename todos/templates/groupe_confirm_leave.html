{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>Quitter le groupe</h2>
        <p>Êtes-vous sûr de vouloir quitter le groupe « {{ groupe.nom }} » ?</p>

        <div class="form-actions" style="margin-top:1.5rem;">
            <a href="{% url 'groupe_detail' pk=groupe.pk %}" class="btn btn-secondary">Annuler</a>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Quitter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
