{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <script>
        (function() {
            var saved = localStorage.getItem("theme");
            if (saved) document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/accueil.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="{% url 'accueil' %}"><h1>ToDoList</h1></a>
        </div>
        <div class="nav-links">
            <a href="{% url 'accueil' %}" class="nav-link {% if request.resolver_match.url_name == 'accueil' %}active{% endif %}">Accueil</a>
            <a href="{% url 'tache_list' %}" class="nav-link {% if 'tache' in request.resolver_match.url_name %}active{% endif %}">Mes tâches</a>
            <a href="{% url 'groupe_list' %}" class="nav-link {% if 'groupe' in request.resolver_match.url_name %}active{% endif %}">Groupes</a>
            <a href="{% url 'notifications' %}" class="nav-link {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
                Notifications
                {% if unread_notification_count %}
                    <span class="nav-notif-dot"></span>
                {% endif %}
            </a>
        </div>
        <div class="nav-user">
            <button class="theme-toggle" id="theme-toggle" title="Changer de thème">
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <span>{{ user.username }}</span>
            <a href="{% url 'admin:index' %}" class="btn btn-sm">Admin</a>
            <a href="{% url 'logout' %}" class="btn btn-sm">Déconnexion</a>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        <div class="messages">
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/accueil.js' %}"></script>
</body>
</html>
