{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block auth_title %}AimList{% endblock %}</title>
    <script>
        (function() {
            var saved = localStorage.getItem("theme");
            if (saved) document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/accueil.css' %}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .login-page::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(162, 155, 254, 0.05) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-3%, -2%); }
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            animation: cardSlideUp 0.5s ease;
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card .login-logo {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.35);
        }

        .login-card .login-logo svg {
            width: 28px;
            height: 28px;
            color: #fff;
        }

        .login-card h1 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .login-card .login-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .login-card .form-group {
            margin-bottom: 1.1rem;
        }

        .login-card .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .login-card .form-input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-hover);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .login-card .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .login-card .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .login-card .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 0.75rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .login-card .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.45);
        }

        .login-card .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.3);
        }

        .login-card .help-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            opacity: 0.8;
        }

        .login-card .errorlist {
            list-style: none;
            padding: 0;
            margin: 0.3rem 0 0 0;
        }

        .login-card .errorlist li {
            font-size: 0.78rem;
            color: var(--urgent);
        }

        .login-card .login-error {
            background: rgba(214, 48, 49, 0.08);
            color: var(--urgent);
            border: 1px solid rgba(214, 48, 49, 0.25);
            border-radius: 10px;
            padding: 0.65rem 0.8rem;
            font-size: 0.82rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .login-card .link-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.83rem;
            color: var(--text-muted);
        }

        .login-card .link-text a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-card .link-text a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .login-card .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .login-card .divider::before,
        .login-card .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .login-card .divider span {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        @media (max-width: 500px) {
            .login-card {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                {% block auth_logo %}{% endblock %}
            </div>
            <h1>AimList</h1>
            <p class="login-subtitle">{% block auth_subtitle %}{% endblock %}</p>

            {% if messages %}
                {% for msg in messages %}
                    <div class="login-error">{{ msg }}</div>
                {% endfor %}
            {% endif %}

            {% block auth_content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'js/accueil.js' %}"></script>
</body>
</html>
